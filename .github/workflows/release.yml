name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "release-v*"

jobs:
  build-dmg:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-aarch64

      - name: Install frontend dependencies
        run: bun install

      - name: Build the app (aarch64 DMG, ad-hoc signed)
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Publish DMG to hush-downloads release
        uses: softprops/action-gh-release@v2
        with:
          repository: DeepanshuPal/hush-downloads
          token: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Hush v${{ steps.get-version.outputs.version }}
          generate_release_notes: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
