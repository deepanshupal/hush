name: Release

# Builds the Apple Silicon DMG and publishes it to DeepanshuPal/downloads as
# hush-vX.Y.Z, the one downloads repository for all of the owner's apps.
# Release notes come from the matching CHANGELOG.md section. See BUILD.md.
# Trigger by pushing a `release-v*` tag or from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - "release-v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-dmg:
    permissions:
      contents: read
    # macOS 26 ships the SDK the Apple Intelligence bridge builds against.
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Fail before the (slow) build if CHANGELOG.md has no section for this version.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-aarch64-release
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the app (aarch64 DMG, ad-hoc signed)
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Publish DMG to DeepanshuPal/downloads
        uses: softprops/action-gh-release@v2
        with:
          repository: DeepanshuPal/downloads
          token: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
          tag_name: hush-v${{ steps.get-version.outputs.version }}
          name: Hush v${{ steps.get-version.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          # The repository holds several apps, so its "latest" release means nothing.
          make_latest: "false"
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
