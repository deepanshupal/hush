name: Release

# Builds the Apple Silicon DMG and publishes it to DeepanshuPal/hush-downloads.
# Trigger by pushing a `release-v*` tag or from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - "release-v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build-dmg:
    permissions:
      contents: read
    # macOS 26 ships the SDK the Apple Intelligence bridge builds against.
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-aarch64-release
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the app (aarch64 DMG, ad-hoc signed)
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Publish DMG to hush-downloads
        uses: softprops/action-gh-release@v2
        with:
          repository: DeepanshuPal/hush-downloads
          token: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
          tag_name: v${{ steps.get-version.outputs.version }}
          name: Hush v${{ steps.get-version.outputs.version }}
          generate_release_notes: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
