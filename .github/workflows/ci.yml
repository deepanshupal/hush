name: CI

# App checks on every push/PR, plus an unpublished Apple Silicon DMG for
# pushes to main (downloadable from the run's artifacts). Changes that only
# touch the website are checked by website.yml instead.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**"]
  pull_request:
    paths-ignore: ["website/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: ESLint
        run: bun run lint

      - name: Translations complete
        run: bun run check:translations

      - name: Prettier
        run: bunx prettier --check .

      - name: Keyboard utilities tests
        run: bun run test:keyboard

  build-dmg:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos-aarch64-ci
          cache-bin: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build (aarch64 DMG, ad-hoc signed, not published)
        run: bun run tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: hush-${{ github.sha }}-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
